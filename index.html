<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamStats Live - Main Broadcast</title>
    <style>
        :root {
            --bg-deep: #050507;
            --bg-card: rgba(18, 18, 26, 0.85);
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --loss-red: #ff003c;
            --gain-green: #00ff88;
            --text-main: #ffffff;
            --text-muted: #888899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-width: 1920px;
            min-height: 1080px;
            overflow: auto; /* Enables both horizontal and vertical scrolling */
            display: flex;
            flex-direction: column;
            padding: 50px 80px;
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.08), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 127, 0.08), transparent 30%),
                var(--bg-deep);
        }

        ::-webkit-scrollbar { width: 14px; height: 14px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan)); border-radius: 10px; border: 3px solid var(--bg-deep); }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
        }

        .controls {
            display: flex;
            gap: 15px;
            background: rgba(10, 10, 15, 0.9);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
        }

        .toggle-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s ease;
            text-transform: uppercase;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, var(--neon-pink), #a200ff);
            color: white;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
        }

        #leaderboard {
            position: relative;
            width: 100%;
            flex-grow: 1;
            transition: height 0.4s ease;
        }

        .card {
            position: absolute;
            height: 110px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 35px;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            will-change: transform;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px rgba(255, 0, 127, 0.5), inset 0 0 10px rgba(255, 0, 127, 0.2); border-color: rgba(255, 0, 127, 0.6); }
            50% { box-shadow: 0 0 45px rgba(255, 0, 127, 0.9), inset 0 0 25px rgba(255, 0, 127, 0.5); border-color: var(--neon-pink); }
            100% { box-shadow: 0 0 20px rgba(255, 0, 127, 0.5), inset 0 0 10px rgba(255, 0, 127, 0.2); border-color: rgba(255, 0, 127, 0.6); }
        }

        .card.high-growth {
            animation: pulse-glow 2s infinite;
            z-index: 5;
        }

        .rank {
            font-size: 2.5rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.2);
            width: 70px;
            font-style: italic;
        }

        .avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            margin-right: 25px;
        }

        .info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .username {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .metrics {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .count {
            font-size: 3.2rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }

        .change-tag {
            font-size: 1.5rem;
            font-weight: 900;
            padding: 10px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 160px;
            justify-content: flex-end;
        }

        .change-tag.up { background: rgba(0, 255, 136, 0.15); color: var(--gain-green); border: 1px solid rgba(0, 255, 136, 0.5); }
        .change-tag.down { background: rgba(255, 0, 60, 0.2); color: var(--loss-red); border: 1px solid var(--loss-red); animation: pulse-loss 1.5s infinite alternate; }

        @keyframes pulse-loss { 0% { box-shadow: 0 0 15px rgba(255, 0, 60, 0.5); } 100% { box-shadow: 0 0 35px rgba(255, 0, 60, 0.9); } }
    </style>
</head>
<body>

    <header>
        <h1>Live <span style="color: var(--neon-cyan);">Leaderboard</span></h1>
        <div class="controls">
            <button class="toggle-btn active" onclick="updateDashboard(1, this)">24 Hours</button>
            <button class="toggle-btn" onclick="updateDashboard(3, this)">3 Days</button>
            <button class="toggle-btn" onclick="updateDashboard(7, this)">7 Days</button>
        </div>
    </header>

    <div id="leaderboard"></div>

    <script>
        let globalDataset = {};
        let sortedDates = [];
        const SIGNIFICANT_GROWTH_THRESHOLD = 5000; 
        let activeDaysBack = 1;

        function resolveImagePath(imgString) {
            if (!imgString) return 'https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff';
            if (imgString.startsWith('http')) return imgString;
            
            let basePath = window.location.origin + window.location.pathname;
            if (basePath.endsWith('.html')) basePath = basePath.substring(0, basePath.lastIndexOf('/'));
            if (basePath.endsWith('/')) basePath = basePath.slice(0, -1);
            if (imgString.startsWith('/')) imgString = imgString.substring(1);
            
            return `${basePath}/${imgString}`;
        }

        function formatNumber(num) { return num.toLocaleString('en-US'); }

        async function init() {
            try {
                const response = await fetch('data.json?t=' + Date.now());
                globalDataset = await response.json();
                sortedDates = Object.keys(globalDataset).sort((a, b) => b.localeCompare(a));
                if (sortedDates.length > 0) updateDashboard(activeDaysBack, document.querySelector('.toggle-btn.active'));
            } catch (error) { console.error('Error fetching data:', error); }
        }

        function updateDashboard(daysBack, btnElement) {
            activeDaysBack = daysBack;
            if (btnElement) {
                document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
                btnElement.classList.add('active');
            }

            const latestDate = sortedDates[0];
            const targetIndex = Math.min(daysBack, sortedDates.length - 1);
            const pastDate = sortedDates[targetIndex];
            
            let leaderArray = [];
            for (const [username, currentMetrics] of Object.entries(globalDataset[latestDate])) {
                const currentCount = currentMetrics.count;
                const pastCount = (globalDataset[pastDate] && globalDataset[pastDate][username]) ? globalDataset[pastDate][username].count : currentCount;
                leaderArray.push({
                    username, currentCount, growth: currentCount - pastCount, img: resolveImagePath(currentMetrics.img)
                });
            }

            leaderArray.sort((a, b) => b.growth - a.growth);
            renderCards(leaderArray);
        }

        function renderCards(leaderArray) {
            const board = document.getElementById('leaderboard');
            const cardHeight = 110; 
            const gapX = 40; 
            const gapY = 20; 

            // Calculate grid dimensions dynamically to allow scrolling logic
            const rows = Math.ceil(leaderArray.length / 2);
            board.style.height = `${rows * (cardHeight + gapY)}px`;

            leaderArray.forEach((user, index) => {
                let card = document.getElementById(`card-${user.username}`);
                const isHighGrowth = user.growth >= SIGNIFICANT_GROWTH_THRESHOLD;
                const isLoss = user.growth < 0;
                
                if (!card) {
                    card = document.createElement('div');
                    card.id = `card-${user.username}`;
                    card.className = 'card';
                    board.appendChild(card);
                }

                const col = index % 2; 
                const row = Math.floor(index / 2);
                card.style.width = `calc(50% - ${gapX / 2}px)`;
                
                const xOffset = col === 0 ? '0px' : `calc(100% + ${gapX}px)`;
                const yOffset = `${row * (cardHeight + gapY)}px`;
                
                card.style.transform = `translate(${xOffset}, ${yOffset})`;
                card.className = `card ${isHighGrowth ? 'high-growth' : ''}`;

                card.innerHTML = `
                    <div class="rank">#${index + 1}</div>
                    <img class="avatar" src="${user.img}" alt="${user.username}" onerror="this.src='https://ui-avatars.com/api/?name=${user.username}&background=0D8ABC&color=fff'">
                    <div class="info"><div class="username">@${user.username}</div></div>
                    <div class="metrics">
                        <div class="count">${formatNumber(user.currentCount)}</div>
                        <div class="change-tag ${isLoss ? 'down' : 'up'}">${isLoss ? '▼' : '▲'} ${formatNumber(Math.abs(user.growth))}</div>
                    </div>
                `;
            });
        }

        window.addEventListener('DOMContentLoaded', init);
        setInterval(init, 60000); 
    </script>
</body>
</html>
