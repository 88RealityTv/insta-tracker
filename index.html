<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamStats Live - Desktop</title>
    <style>
        :root {
            --bg-dark: #09090b;
            --bg-card: rgba(18, 18, 26, 0.7);
            --neon-pink: #ff2a6d;
            --neon-cyan: #05d9e8;
            --neon-red: #ff003c;
            --neon-green: #01ffc3;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: var(--bg-dark);
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 2rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .controls {
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            border-radius: 12px;
            display: inline-flex;
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            align-self: center;
        }

        .controls button {
            background: transparent;
            color: white;
            border: 1px solid var(--glass-border);
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .controls button.active {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 15px var(--neon-cyan);
            border-color: var(--neon-cyan);
        }

        #leaderboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1.5rem;
            width: 100%;
            align-items: start;
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .card.high-growth {
            animation: pulse-glow 2s infinite alternate;
            border-color: var(--neon-pink);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 5px var(--neon-pink), inset 0 0 10px rgba(255, 42, 109, 0.2); }
            100% { box-shadow: 0 0 25px var(--neon-pink), inset 0 0 20px rgba(255, 42, 109, 0.4); }
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
        }

        .info {
            flex-grow: 1;
        }

        .username {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ccc;
            margin-bottom: 0.2rem;
        }

        .count {
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .change-tag {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 900;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .change-tag.positive {
            background: rgba(1, 255, 195, 0.15);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 10px rgba(1, 255, 195, 0.2);
        }

        .change-tag.negative {
            background: rgba(255, 0, 60, 0.2);
            color: white;
            border: 1px solid var(--neon-red);
            box-shadow: 0 0 15px var(--neon-red);
        }
    </style>
</head>
<body>

    <div class="controls">
        <button data-range="1" class="active">24 Hours</button>
        <button data-range="3">3 Days</button>
        <button data-range="7">7 Days</button>
    </div>

    <div id="leaderboard"></div>

    <script>
        let rawData = {};
        
        function resolveImageUrl(imgPath) {
            if (imgPath.startsWith('http')) return imgPath;
            let path = window.location.pathname;
            if (path.endsWith('.html')) path = path.substring(0, path.lastIndexOf('/'));
            return window.location.origin + path + '/' + imgPath;
        }

        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        async function init() {
            try {
                const response = await fetch('data.json');
                rawData = await response.json();
                renderData(1);
            } catch (e) {
                console.error("Error loading data.json", e);
            }
        }

        function renderData(days) {
            const dates = Object.keys(rawData).sort();
            if (dates.length === 0) return;

            const latestDate = dates[dates.length - 1];
            const targetDateIndex = Math.max(0, dates.length - 1 - days);
            const baselineDate = dates[targetDateIndex];

            const latestData = rawData[latestDate];
            const baselineData = rawData[baselineDate];

            let stats = [];
            for (const username in latestData) {
                const currentCount = latestData[username].count;
                const img = resolveImageUrl(latestData[username].img);
                const prevCount = baselineData[username] ? baselineData[username].count : currentCount;
                const growth = currentCount - prevCount;
                stats.push({ username, currentCount, growth, img });
            }

            stats.sort((a, b) => b.growth - a.growth);

            const container = document.getElementById('leaderboard');
            
            // FLIP Animation Prep
            const oldCards = Array.from(container.children);
            const oldRects = new Map();
            oldCards.forEach(card => oldRects.set(card.dataset.user, card.getBoundingClientRect()));

            container.innerHTML = '';

            const maxGrowth = Math.max(...stats.map(s => s.growth));

            stats.forEach(stat => {
                const isHighGrowth = stat.growth > 0 && stat.growth === maxGrowth && stat.growth > 1000;
                const isNegative = stat.growth < 0;
                const sign = stat.growth > 0 ? '+' : '';
                
                const card = document.createElement('div');
                card.className = `card ${isHighGrowth ? 'high-growth' : ''}`;
                card.dataset.user = stat.username;
                
                card.innerHTML = `
                    <img src="${stat.img}" class="avatar" onerror="this.src='https://ui-avatars.com/api/?name=${stat.username}&background=random'">
                    <div class="info">
                        <div class="username">@${stat.username}</div>
                        <div class="count">${formatNumber(stat.currentCount)}</div>
                    </div>
                    <div class="change-tag ${isNegative ? 'negative' : 'positive'}">
                        ${sign}${formatNumber(stat.growth)}
                    </div>
                `;
                container.appendChild(card);
            });

            // FLIP Animation Execute
            const newCards = Array.from(container.children);
            newCards.forEach(card => {
                const oldRect = oldRects.get(card.dataset.user);
                if (oldRect) {
                    const newRect = card.getBoundingClientRect();
                    const dx = oldRect.left - newRect.left;
                    const dy = oldRect.top - newRect.top;
                    if (dx !== 0 || dy !== 0) {
                        card.style.transform = `translate(${dx}px, ${dy}px)`;
                        card.style.transition = 'none';
                        requestAnimationFrame(() => {
                            card.style.transform = '';
                            card.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
                        });
                    }
                } else {
                    card.style.opacity = 0;
                    card.style.transform = 'scale(0.9)';
                    requestAnimationFrame(() => {
                        card.style.transition = 'all 0.5s ease-out';
                        card.style.opacity = 1;
                        card.style.transform = 'scale(1)';
                    });
                }
            });
        }

        document.querySelectorAll('.controls button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderData(parseInt(e.target.dataset.range));
            });
        });

        init();
        setInterval(init, 60000); // Refresh data every 60 seconds
    </script>
</body>
</html>
