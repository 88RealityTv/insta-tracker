<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamStats Live Tracker</title>
    <style>
        :root {
            --bg-deep: #09090b;
            --bg-card: #12121a;
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --loss-red: #ff003c;
            --text-main: #ffffff;
            --text-muted: #888899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px;
        }

        header {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
        }

        .controls {
            display: flex;
            gap: 20px;
            background: rgba(18, 18, 26, 0.8);
            padding: 10px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.2);
        }

        .toggle-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .toggle-btn.active {
            background: linear-gradient(45deg, var(--neon-pink), #9d00ff);
            color: white;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        #leaderboard {
            position: relative;
            width: 100%;
            max-width: 1400px;
            height: 800px;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 120px;
            background: rgba(18, 18, 26, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px var(--neon-pink), inset 0 0 10px var(--neon-pink); border-color: var(--neon-pink); }
            50% { box-shadow: 0 0 30px var(--neon-pink), inset 0 0 15px var(--neon-pink); border-color: #ff4da6; }
            100% { box-shadow: 0 0 10px var(--neon-pink), inset 0 0 10px var(--neon-pink); border-color: var(--neon-pink); }
        }

        .card.high-growth {
            animation: pulse-glow 2s infinite;
            z-index: 5;
        }

        .rank {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--text-muted);
            width: 60px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            margin-right: 30px;
        }

        .info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .username {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .metrics {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .count {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        .change-tag {
            font-size: 1.5rem;
            font-weight: 900;
            padding: 8px 20px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-variant-numeric: tabular-nums;
        }

        .change-tag.up {
            background: rgba(0, 243, 255, 0.15);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
        }

        .change-tag.down {
            background: rgba(255, 0, 60, 0.15);
            color: var(--loss-red);
            border: 1px solid var(--loss-red);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1>Leaderboard <span style="color: var(--neon-cyan);">Live</span></h1>
        <div class="controls">
            <button class="toggle-btn active" onclick="updateDashboard(1, this)">24 Hours</button>
            <button class="toggle-btn" onclick="updateDashboard(3, this)">3 Days</button>
            <button class="toggle-btn" onclick="updateDashboard(7, this)">7 Days</button>
        </div>
    </header>

    <div id="leaderboard"></div>

    <script>
        let globalDataset = {};
        let sortedDates = [];
        const SIGNIFICANT_GROWTH_THRESHOLD = 5000; 

        function resolveImagePath(imgString) {
            if (!imgString) return '';
            if (imgString.startsWith('http')) return imgString;
            let basePath = window.location.origin + window.location.pathname;
            basePath = basePath.substring(0, basePath.lastIndexOf('/'));
            return `${basePath}/${imgString}`;
        }

        function formatNumber(num) {
            return num.toLocaleString('en-US');
        }

        async function init() {
            try {
                const response = await fetch('data.json');
                globalDataset = await response.json();
                
                sortedDates = Object.keys(globalDataset).sort((a, b) => b.localeCompare(a));
                
                if (sortedDates.length > 0) {
                    updateDashboard(1, document.querySelector('.toggle-btn.active'));
                }
            } catch (error) {
                console.error('Error fetching data.json:', error);
            }
        }

        function updateDashboard(daysBack, btnElement) {
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            const latestDate = sortedDates[0];
            const targetIndex = Math.min(daysBack, sortedDates.length - 1);
            const pastDate = sortedDates[targetIndex];

            const latestData = globalDataset[latestDate];
            const pastData = globalDataset[pastDate];

            let leaderArray = [];

            for (const [username, currentMetrics] of Object.entries(latestData)) {
                const currentCount = currentMetrics.count;
                const pastCount = (pastData && pastData[username]) ? pastData[username].count : currentCount;
                const growth = currentCount - pastCount;

                leaderArray.push({
                    username,
                    currentCount,
                    growth,
                    img: resolveImagePath(currentMetrics.img)
                });
            }

            leaderArray.sort((a, b) => b.growth - a.growth);
            renderCards(leaderArray);
        }

        function renderCards(leaderArray) {
            const board = document.getElementById('leaderboard');
            const cardHeight = 120;
            const gap = 20;

            leaderArray.forEach((user, index) => {
                let card = document.getElementById(`card-${user.username}`);
                
                const isHighGrowth = user.growth >= SIGNIFICANT_GROWTH_THRESHOLD;
                const isLoss = user.growth < 0;
                const growthText = user.growth > 0 ? `+${formatNumber(user.growth)}` : formatNumber(user.growth);
                const tagClass = isLoss ? 'down' : 'up';
                const arrow = isLoss ? '▼' : '▲';

                if (!card) {
                    card = document.createElement('div');
                    card.id = `card-${user.username}`;
                    card.className = 'card';
                    board.appendChild(card);
                }

                card.className = `card ${isHighGrowth ? 'high-growth' : ''}`;
                card.style.transform = `translateY(${index * (cardHeight + gap)}px)`;

                card.innerHTML = `
                    <div class="rank">#${index + 1}</div>
                    <img class="avatar" src="${user.img}" alt="${user.username}">
                    <div class="info">
                        <div class="username">@${user.username}</div>
                    </div>
                    <div class="metrics">
                        <div class="count">${formatNumber(user.currentCount)}</div>
                        <div class="change-tag ${tagClass}">
                            ${arrow} ${growthText}
                        </div>
                    </div>
                `;
            });
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', init);
        
        // Auto-refresh logic for live broadcast if dataset updates externally
        setInterval(init, 300000); // Polling every 5 minutes
    </script>
</body>
</html>
