<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Instagram Tracker</title>
    <style>
        /* OBS Optimized Styling (Dark background, high contrast, clean fonts) */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #0f0f12; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            padding: 30px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            letter-spacing: 1px;
            color: #e2e8f0;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); /* 4 columns grid, changes to rows nicely in OBS */
            gap: 20px; 
        }
        .card { 
            background: #1a1a24; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2d2d3d;
            transition: transform 0.2s;
        }
        .name { 
            font-size: 18px; 
            font-weight: 700; 
            color: #a0aec0;
            margin-bottom: 8px;
            text-transform: lowercase;
        }
        .name::before {
            content: "@";
            color: #e1306c; /* Instagram pink accent */
            margin-right: 2px;
        }
        .count { 
            font-size: 32px; 
            font-weight: 800;
            color: #ffffff; 
            margin-bottom: 15px; 
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 4px 0;
            border-top: 1px solid #2d2d3d;
        }
        .stat-label { color: #718096; }
        .up { color: #4caf50; font-weight: bold; }
        .down { color: #f44336; font-weight: bold; }
        .neutral { color: #a0aec0; }
    </style>
</head>
<body>

    <h1>📊 LIVE FOLLOWER INSIGHTS</h1>
    <div class="grid" id="dashboard">Loading data...</div>

    <script>
        // Helper function to format numbers cleanly (e.g., 97,105,000)
        function formatNum(num) {
            return num ? num.toLocaleString() : 'N/A';
        }

        // Helper function to calculate and format changes
        function getTrendHTML(todayVal, pastVal) {
            if (!todayVal || !pastVal) return `<span class="neutral">--</span>`;
            const diff = todayVal - pastVal;
            if (diff > 0) return `<span class="up">▲ +${formatNum(diff)}</span>`;
            if (diff < 0) return `<span class="down">▼ ${formatNum(diff)}</span>`;
            return `<span class="neutral">0</span>`;
        }

        // Main logic to process the data
        async function loadTracker() {
            try {
                // Fetch data.json from the same directory
                const response = await fetch('data.json');
                const data = await response.json();
                
                // Get sorted list of dates available in JSON
                const dates = Object.keys(data).sort();
                if (dates.length === 0) return;

                const todayDate = dates[dates.length - 1];
                const yesterdayDate = dates[dates.length - 2] || null;
                
                // Try to find a date roughly 7 entries back, or fallback to the oldest available
                const weekAgoIndex = Math.max(0, dates.length - 7);
                const weekAgoDate = dates[weekAgoIndex] !== todayDate ? dates[weekAgoIndex] : null;

                const todayData = data[todayDate];
                const yesterdayData = yesterdayDate ? data[yesterdayDate] : {};
                const weekAgoData = weekAgoDate ? data[weekAgoDate] : {};

                const container = document.getElementById('dashboard');
                container.innerHTML = ''; // Clear loading text

                // Generate a card for each user present in today's dataset
                for (const username in todayData) {
                    const currentCount = todayData[username];
                    const yesterdayCount = yesterdayData[username] || null;
                    const weekAgoCount = weekAgoData[username] || null;

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="name">${username}</div>
                        <div class="count">${formatNum(currentCount)}</div>
                        <div class="stat-row">
                            <span class="stat-label">Last 24h</span>
                            ${getTrendHTML(currentCount, yesterdayCount)}
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Last 7d</span>
                            ${getTrendHTML(currentCount, weekAgoCount)}
                        </div>
                    `;
                    container.appendChild(card);
                }
            } catch (error) {
                document.getElementById('dashboard').innerText = "Failed to load data. Make sure data.json is properly formatted.";
                console.error(error);
            }
        }

        // Run on load
        loadTracker();
    </script>
</body>
</html>
