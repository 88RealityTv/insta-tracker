<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamStats Live Tracker</title>
    <style>
        :root {
            --bg-deep: #09090b;
            --bg-card: #12121a;
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --loss-red: #ff003c;
            --gain-green: #00ff88;
            --text-main: #ffffff;
            --text-muted: #888899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            width: 1920px;
            min-height: 1080px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 80px;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 127, 0.05), transparent 25%);
        }

        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-deep);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--neon-pink), #8a2be2);
            border-radius: 10px;
            border: 2px solid var(--bg-deep);
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
        }

        .controls {
            display: flex;
            gap: 15px;
            background: rgba(18, 18, 26, 0.6);
            padding: 10px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .toggle-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, var(--neon-pink), #8a2be2);
            color: white;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #leaderboard {
            position: relative;
            width: 100%;
            transition: height 0.3s ease;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 120px;
            background: rgba(18, 18, 26, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 243, 255, 0.15);
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 40px;
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            will-change: transform;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(255, 0, 127, 0.4), inset 0 0 10px rgba(255, 0, 127, 0.2); border-color: rgba(255, 0, 127, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 0, 127, 0.8), inset 0 0 20px rgba(255, 0, 127, 0.4); border-color: var(--neon-pink); }
            100% { box-shadow: 0 0 15px rgba(255, 0, 127, 0.4), inset 0 0 10px rgba(255, 0, 127, 0.2); border-color: rgba(255, 0, 127, 0.5); }
        }

        .card.high-growth {
            animation: pulse-glow 2s infinite;
            z-index: 5;
            background: rgba(255, 0, 127, 0.05);
        }

        .rank {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--text-muted);
            width: 80px;
            font-style: italic;
        }

        .avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            margin-right: 30px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .username {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .metrics {
            display: flex;
            align-items: center;
            gap: 50px;
        }

        .count {
            font-size: 4rem;
            font-weight: 900;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .change-tag {
            font-size: 1.8rem;
            font-weight: 900;
            padding: 10px 25px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-variant-numeric: tabular-nums;
            min-width: 200px;
            justify-content: flex-end;
        }

        .change-tag.up {
            background: rgba(0, 255, 136, 0.1);
            color: var(--gain-green);
            border: 1px solid rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        .change-tag.down {
            background: rgba(255, 0, 60, 0.15);
            color: var(--loss-red);
            border: 1px solid var(--loss-red);
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.5);
            animation: pulse-loss 2s infinite;
        }

        @keyframes pulse-loss {
            0% { box-shadow: 0 0 15px rgba(255, 0, 60, 0.4); }
            50% { box-shadow: 0 0 35px rgba(255, 0, 60, 0.7); }
            100% { box-shadow: 0 0 15px rgba(255, 0, 60, 0.4); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Leaderboard <span style="color: var(--neon-cyan);">Live</span></h1>
        <div class="controls">
            <button class="toggle-btn active" onclick="updateDashboard(1, this)">24 Hours</button>
            <button class="toggle-btn" onclick="updateDashboard(3, this)">3 Days</button>
            <button class="toggle-btn" onclick="updateDashboard(7, this)">7 Days</button>
        </div>
    </header>

    <div id="leaderboard"></div>

    <script>
        let globalDataset = {};
        let sortedDates = [];
        const SIGNIFICANT_GROWTH_THRESHOLD = 5000; 
        let activeDaysBack = 1;

        // Strip leading slashes to prevent root-domain resolution errors on GitHub Pages
        function resolveImagePath(imgString) {
            if (!imgString) return '';
            if (imgString.startsWith('http')) return imgString;
            
            let basePath = window.location.origin + window.location.pathname;
            
            // Remove filename if running directly in browser (e.g. index.html)
            if (basePath.endsWith('.html')) {
                basePath = basePath.substring(0, basePath.lastIndexOf('/'));
            }
            // Remove trailing slash to prevent double slashes
            if (basePath.endsWith('/')) {
                basePath = basePath.slice(0, -1);
            }
            // Remove leading slash from the JSON image path if present
            if (imgString.startsWith('/')) {
                imgString = imgString.substring(1);
            }
            
            return `${basePath}/${imgString}`;
        }

        function formatNumber(num) {
            return num.toLocaleString('en-US');
        }

        async function init() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                globalDataset = await response.json();
                
                sortedDates = Object.keys(globalDataset).sort((a, b) => b.localeCompare(a));
                
                if (sortedDates.length > 0) {
                    updateDashboard(activeDaysBack, document.querySelector('.toggle-btn.active'));
                }
            } catch (error) {
                console.error('Error fetching data.json:', error);
            }
        }

        function updateDashboard(daysBack, btnElement) {
            activeDaysBack = daysBack;
            if (btnElement) {
                document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
                btnElement.classList.add('active');
            }

            const latestDate = sortedDates[0];
            const targetIndex = Math.min(daysBack, sortedDates.length - 1);
            const pastDate = sortedDates[targetIndex];

            const latestData = globalDataset[latestDate];
            const pastData = globalDataset[pastDate];

            let leaderArray = [];

            for (const [username, currentMetrics] of Object.entries(latestData)) {
                const currentCount = currentMetrics.count;
                const pastCount = (pastData && pastData[username]) ? pastData[username].count : currentCount;
                const growth = currentCount - pastCount;

                leaderArray.push({
                    username,
                    currentCount,
                    growth,
                    img: resolveImagePath(currentMetrics.img)
                });
            }

            leaderArray.sort((a, b) => b.growth - a.growth);
            renderCards(leaderArray);
        }

        function renderCards(leaderArray) {
            const board = document.getElementById('leaderboard');
            const cardHeight = 120;
            const gap = 20;

            // Dynamically expand container height to allow scrolling for 16 profiles
            board.style.height = `${leaderArray.length * (cardHeight + gap)}px`;

            leaderArray.forEach((user, index) => {
                let card = document.getElementById(`card-${user.username}`);
                
                const isHighGrowth = user.growth >= SIGNIFICANT_GROWTH_THRESHOLD;
                const isLoss = user.growth < 0;
                const growthText = user.growth > 0 ? `+${formatNumber(user.growth)}` : formatNumber(user.growth);
                const tagClass = isLoss ? 'down' : 'up';
                const arrow = isLoss ? '▼' : '▲';

                if (!card) {
                    card = document.createElement('div');
                    card.id = `card-${user.username}`;
                    card.className = 'card';
                    board.appendChild(card);
                }

                card.className = `card ${isHighGrowth ? 'high-growth' : ''}`;
                card.style.transform = `translateY(${index * (cardHeight + gap)}px)`;

                card.innerHTML = `
                    <div class="rank">#${index + 1}</div>
                    <img class="avatar" src="${user.img}" alt="${user.username}" onerror="this.src='https://ui-avatars.com/api/?name=${user.username}&background=0D8ABC&color=fff'">
                    <div class="info">
                        <div class="username">@${user.username}</div>
                    </div>
                    <div class="metrics">
                        <div class="count">${formatNumber(user.currentCount)}</div>
                        <div class="change-tag ${tagClass}">
                            ${arrow} ${growthText}
                        </div>
                    </div>
                `;
            });
        }

        window.addEventListener('DOMContentLoaded', init);
        setInterval(init, 60000); 
    </script>
</body>
</html>
