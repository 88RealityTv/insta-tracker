<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>StreamStats - Horizontal</title>
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: rgba(18, 18, 26, 0.6);
            --pink: #d6249f;
            --pink-grad: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --cyan: #00f3ff;
            --text-main: #ffffff;
            --text-muted: #8892b0;
            --card-h: 120px;
            --card-gap: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1f1f3a 0%, transparent 50%);
            color: var(--text-main);
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 50px 100px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            z-index: 10;
        }

        .title-box h1 {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: var(--pink-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 10px;
            gap: 10px;
        }

        .controls button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            font-weight: 700;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .controls button.active {
            background: var(--text-main);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .leaderboard {
            position: relative;
            flex: 1;
            width: 100%;
        }

        .card {
            position: absolute;
            left: 0;
            right: 0;
            height: var(--card-h);
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 0 40px;
            transition: top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: visible;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px var(--glow-color), inset 0 0 5px var(--glow-color); }
            50% { box-shadow: 0 0 25px var(--glow-color), inset 0 0 10px var(--glow-color); }
            100% { box-shadow: 0 0 5px var(--glow-color), inset 0 0 5px var(--glow-color); }
        }

        .card.active-glow {
            border-color: var(--glow-color);
            animation: pulseGlow 2s infinite ease-in-out;
        }

        .marker {
            position: absolute;
            top: -15px;
            right: 30px;
            background: var(--bg-color);
            border: 2px solid var(--glow-color);
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 900;
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 5;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid var(--text-muted);
            object-fit: cover;
            margin-right: 30px;
        }

        .info {
            flex: 1;
        }

        .username {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .count {
            font-size: 1.5rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .change-tag {
            font-size: 2.2rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
            font-variant-numeric: tabular-nums;
        }

    </style>
</head>
<body>
    <div class="header">
        <div class="title-box">
            <h1>Follower Tracker</h1>
        </div>
        <div class="controls">
            <button onclick="updateData(1)" id="btn-1">24 Hours</button>
            <button onclick="updateData(3)" id="btn-3" class="active">3 Days</button>
            <button onclick="updateData(7)" id="btn-7">7 Days</button>
        </div>
    </div>
    <div class="leaderboard" id="leaderboard"></div>

    <script>
        let rawData = null;
        let dates = [];
        const cardHeight = 120;
        const cardGap = 20;

        async function init() {
            try {
                const res = await fetch('data.json');
                rawData = await res.json();
                dates = Object.keys(rawData).sort();
                updateData(3);
            } catch (err) {
                console.error("Error loading data.json", err);
            }
        }

        function getAbsolutePath(path) {
            if(path.startsWith('http')) return path;
            const baseUrl = window.location.origin + window.location.pathname;
            return new URL(path, baseUrl).href;
        }

        function updateData(daysAgo) {
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${daysAgo}`).classList.add('active');

            if (!dates.length) return;
            const latestDate = dates[dates.length - 1];
            const pastIndex = Math.max(0, dates.length - 1 - daysAgo);
            const pastDate = dates[pastIndex];

            const currentStats = rawData[latestDate];
            const pastStats = rawData[pastDate];

            let players = [];
            let posPercents = [];
            let negPercents = [];

            for (const [user, data] of Object.entries(currentStats)) {
                const currentCount = data.count;
                const pastCount = pastStats[user] ? pastStats[user].count : currentCount;
                const growth = currentCount - pastCount;
                const percent = pastCount > 0 ? (growth / pastCount) * 100 : 0;

                if(percent > 0) posPercents.push(percent);
                if(percent < 0) negPercents.push(Math.abs(percent));

                players.push({ user, currentCount, growth, percent, img: data.img });
            }

            players.sort((a, b) => b.growth - a.growth);

            const maxPos = Math.max(...posPercents, 0.01);
            const minPos = Math.min(...posPercents, 0);
            const maxNeg = Math.max(...negPercents, 0.01);
            const minNeg = Math.min(...negPercents, 0);

            const board = document.getElementById('leaderboard');
            
            players.forEach((p, index) => {
                let card = document.getElementById(`card-${p.user}`);
                if (!card) {
                    card = document.createElement('div');
                    card.id = `card-${p.user}`;
                    card.className = 'card active-glow';
                    card.innerHTML = `
                        <div class="marker" id="marker-${p.user}"></div>
                        <img class="avatar" id="img-${p.user}" src="" alt="">
                        <div class="info">
                            <div class="username">${p.user}</div>
                            <div class="count" id="count-${p.user}"></div>
                        </div>
                        <div class="change-tag" id="change-${p.user}"></div>
                    `;
                    board.appendChild(card);
                }

                card.style.top = `${index * (cardHeight + cardGap)}px`;
                document.getElementById(`img-${p.user}`).src = getAbsolutePath(p.img);
                document.getElementById(`count-${p.user}`).innerText = p.currentCount.toLocaleString();

                const changeEl = document.getElementById(`change-${p.user}`);
                const markerEl = document.getElementById(`marker-${p.user}`);
                
                let glowColor, intensity;
                if (p.growth > 0) {
                    changeEl.innerText = `▲ +${p.growth.toLocaleString()}`;
                    changeEl.style.color = '#00ff88';
                    let ratio = posPercents.length > 1 ? (p.percent - minPos) / (maxPos - minPos) : 1;
                    intensity = 0.3 + (0.7 * ratio); // 0.3 to 1.0
                    glowColor = `rgba(0, 255, 136, ${intensity})`;
                    markerEl.innerText = index === 0 ? "🏆 TOP GAINER" : "📈 UP";
                } else if (p.growth < 0) {
                    changeEl.innerText = `▼ ${p.growth.toLocaleString()}`;
                    changeEl.style.color = '#ff3366';
                    let absP = Math.abs(p.percent);
                    let ratio = negPercents.length > 1 ? (absP - minNeg) / (maxNeg - minNeg) : 1;
                    intensity = 0.3 + (0.7 * ratio);
                    glowColor = `rgba(255, 51, 102, ${intensity})`;
                    markerEl.innerText = index === players.length - 1 ? "🔻 BIGGEST DROP" : "⚠️ LOSS";
                } else {
                    changeEl.innerText = `- 0`;
                    changeEl.style.color = 'var(--text-muted)';
                    glowColor = 'rgba(255,255,255,0.1)';
                    card.classList.remove('active-glow');
                    markerEl.innerText = "FLAT";
                }

                if(p.growth !== 0) card.classList.add('active-glow');
                card.style.setProperty('--glow-color', glowColor);
                markerEl.style.color = p.growth > 0 ? '#00ff88' : (p.growth < 0 ? '#ff3366' : 'var(--text-muted)');
            });
        }

        init();
    </script>
</body>
</html>
