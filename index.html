<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS Live Leaderboard Tracker</title>
    <style>
        /* Cyberpunk Dark Broadcast Aesthetic */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #09090b; 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            padding: 25px; 
            overflow: hidden;
        }
        
        /* Premium Backdrop-Blur Glassmorphism Control Panel */
        .controls-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        .toggle-wrapper {
            background: rgba(26, 26, 36, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px;
            border-radius: 30px;
            display: inline-flex;
            border: 1px solid rgba(225, 48, 108, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .toggle-btn {
            background: transparent;
            border: none;
            color: #a0aec0;
            padding: 10px 28px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toggle-btn.active {
            color: #ffffff;
            background: linear-gradient(45deg, #e1306c, #f77737);
            box-shadow: 0 4px 15px rgba(225, 48, 108, 0.5);
        }

        /* 4-Column Layout Grid with Smooth Transitions */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 18px; 
        }

        /* High-Contrast Card Base */
        .card { 
            background: #12121a; 
            padding: 16px; 
            border-radius: 14px; 
            border: 1px solid #222232; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
        }

        /* Dynamic Visual Hook: High-Growth Profile Neon Pulse Border */
        .card.pulse-glow {
            border-color: #22c55e;
            animation: neonPulse 2s infinite alternate ease-in-out;
        }

        /* Rank Badge */
        .rank-badge {
            position: absolute;
            top: -8px;
            left: -8px;
            background: #222232;
            color: #a0aec0;
            font-size: 11px;
            font-weight: 900;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #33334d;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .card.pulse-glow .rank-badge {
            background: #22c55e;
            color: #09090b;
            border-color: #22c55e;
        }

        .profile-img { 
            width: 58px; 
            height: 58px; 
            border-radius: 50%; 
            border: 2px solid #e1306c; 
            object-fit: cover; 
            flex-shrink: 0;
        }
        .info { flex-grow: 1; min-width: 0; }
        .name { 
            font-size: 16px; 
            font-weight: 700; 
            color: #f1f5f9; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            margin-bottom: 2px;
        }
        .count { 
            font-size: 24px; 
            font-weight: 900; 
            color: #ffffff; 
            letter-spacing: -0.5px;
            margin-bottom: 6px; 
        }
        .stat-row { 
            display: flex; 
            justify-content: space-between; 
            font-size: 13px; 
            padding-top: 5px; 
            border-top: 1px solid #20202c; 
        }
        .stat-label { color: #64748b; font-weight: 600; }
        
        /* Attention Grabbing Growth Tags */
        .up { color: #22c55e; font-weight: 800; text-shadow: 0 0 8px rgba(34, 197, 94, 0.3); }
        .down { color: #ef4444; font-weight: 800; text-shadow: 0 0 8px rgba(239, 68, 68, 0.3); }
        .neutral { color: #64748b; font-weight: 700; }

        /* Keyframe Pulse Animation Rule */
        @keyframes neonPulse {
            0% {
                box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 2px rgba(34, 197, 94, 0.2);
            }
            100% {
                box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 12px rgba(34, 197, 94, 0.6);
            }
        }
    </style>
</head>
<body>

    <!-- Dynamic Control Block -->
    <div class="controls-container">
        <div class="toggle-wrapper">
            <button class="toggle-btn active" onclick="changeRange(1, this)">24 Hours</button>
            <button class="toggle-btn" onclick="changeRange(3, this)">3 Days</button>
            <button class="toggle-btn" onclick="changeRange(7, this)">7 Days</button>
        </div>
    </div>

    <!-- Main Output Viewport -->
    <div class="grid" id="dashboard">Loading leaderboard arrays...</div>

    <script>
        let globalData = {};
        let currentDaysOffset = 1;

        // Path safety resolution logic for local GitHub Pages subfolders
        const currentPath = window.location.pathname;
        const directoryPath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
        const baseUrl = window.location.origin + directoryPath;

        function formatNum(n) { return n ? n.toLocaleString() : '0'; }
        
        function getTrendHTML(diff) {
            if (diff === null || diff === undefined) return `<span class="neutral">--</span>`;
            if (diff > 0) return `<span class="up">▲ +${formatNum(diff)}</span>`;
            if (diff < 0) return `<span class="down">▼ ${formatNum(diff)}</span>`;
            return `<span class="neutral">0</span>`;
        }

        function changeRange(days, element) {
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            currentDaysOffset = days;
            renderDashboard();
        }

        function renderDashboard() {
            const dates = Object.keys(globalData).sort();
            if (dates.length === 0) return;

            const todayIndex = dates.length - 1;
            const pastIndex = Math.max(0, todayIndex - currentDaysOffset);

            const todayDate = dates[todayIndex];
            const pastDate = dates[pastIndex];

            const tData = globalData[todayDate];
            const pData = (pastIndex !== todayIndex) ? globalData[pastDate] : {};
            
            const container = document.getElementById('dashboard');
            container.innerHTML = '';

            const rangeLabels = { 1: "24h Growth", 3: "3d Growth", 7: "7d Growth" };

            // 1. Process data metrics into sortable array structures
            let profileList = [];
            for (const user in tData) {
                const cur = tData[user].count;
                const pastVal = pData[user] ? pData[user].count : undefined;
                const diff = (pastVal !== undefined) ? (cur - pastVal) : 0;
                
                profileList.push({
                    name: user,
                    count: cur,
                    img: tData[user].img || '',
                    diff: (pastVal !== undefined) ? diff : null
                });
            }

            // 2. Gamification Rule: Competitive Leaderboard Sorting (Highest Growth First)
            profileList.sort((a, b) => {
                if (a.diff === null) return 1;
                if (b.diff === null) return -1;
                return b.diff - a.diff;
            });

            // 3. Render Cards Element Trees Loop
            profileList.forEach((profile, index) => {
                let imgUrl = profile.img;

                // Format local structural file references cleanly
                if (imgUrl && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
                    if (imgUrl.startsWith('./')) imgUrl = imgUrl.substring(2);
                    imgUrl = baseUrl + imgUrl;
                } else if (!imgUrl) {
                    imgUrl = 'https://placeholder.com';
                }

                // Apply pulse glow trigger dynamically if the net trend calculation has increased
                const isHighGrowth = profile.diff !== null && profile.diff > 0;
                const cardClass = isHighGrowth ? 'card pulse-glow' : 'card';

                const card = document.createElement('div');
                card.className = cardClass;
                card.style.order = index; // CSS Grid ordering parameter assignment
                
                card.innerHTML = `
                    <div class="rank-badge">${index + 1}</div>
                    <img class="profile-img" src="${imgUrl}" alt="${profile.name}" onerror="this.src='https://placeholder.com'">
                    <div class="info">
                        <div class="name">${profile.name}</div>
                        <div class="count">${formatNum(profile.count)}</div>
                        <div class="stat-row">
                            <span class="stat-label">${rangeLabels[currentDaysOffset]}:</span> 
                            ${getTrendHTML(profile.diff)}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function init() {
            try {
                const res = await fetch('data.json');
                globalData = await res.json();
                renderDashboard();
