<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamStats Live - Main Broadcast</title>
    <style>
        :root {
            --bg-deep: #050507;
            --bg-card: rgba(18, 18, 26, 0.85);
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --loss-red: #ff003c;
            --gain-green: #00ff88;
            --text-main: #ffffff;
            --text-muted: #888899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Enforces scrollability horizontally and vertically */
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            width: 100%;
            height: 100vh;
            overflow: auto;
            display: flex;
            flex-direction: column;
            padding: 40px 5%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.08), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 127, 0.08), transparent 30%),
                var(--bg-deep);
        }

        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, var(--neon-pink), var(--neon-cyan)); border-radius: 6px; }

        header {
            width: 100%;
            min-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            z-index: 10;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .broadcast-logo {
            height: 60px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .controls {
            display: flex;
            gap: 15px;
            background: rgba(10, 10, 15, 0.9);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
        }

        .toggle-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s ease;
            text-transform: uppercase;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, var(--neon-pink), #a200ff);
            color: white;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.6);
        }

        #leaderboard {
            position: relative;
            width: 100%;
            min-width: 900px; /* Forces horizontal scroll on narrow windows */
            flex-grow: 1;
            transition: height 0.4s ease;
        }

        .card {
            position: absolute;
            height: 110px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            will-change: transform, opacity;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px rgba(255, 0, 127, 0.5), inset 0 0 10px rgba(255, 0, 127, 0.2); border-color: rgba(255, 0, 127, 0.6); }
            50% { box-shadow: 0 0 45px rgba(255, 0, 127, 0.9), inset 0 0 25px rgba(255, 0, 127, 0.5); border-color: var(--neon-pink); }
            100% { box-shadow: 0 0 20px rgba(255, 0, 127, 0.5), inset 0 0 10px rgba(255, 0, 127, 0.2); border-color: rgba(255, 0, 127, 0.6); }
        }

        .card.high-growth {
            animation: pulse-glow 2s infinite;
            z-index: 5;
        }

        .rank {
            font-size: 2.5rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.2);
            width: 60px;
            font-style: italic;
        }

        .avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            margin-right: 20px;
        }

        .info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .username {
            font-size: 1.8rem;
            font-weight: 800;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .metrics {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-left: 15px;
        }

        .count {
            font-size: 3rem;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }

        .stats-col {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }

        .change-tag {
            font-size: 1.3rem;
            font-weight: 900;
            padding: 6px 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 140px;
            justify-content: flex-end;
        }

        .pct-tag {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .change-tag.up { background: rgba(0, 255, 136, 0.15); color: var(--gain-green); border: 1px solid rgba(0, 255, 136, 0.5); }
        .change-tag.down { background: rgba(255, 0, 60, 0.2); color: var(--loss-red); border: 1px solid var(--loss-red); animation: pulse-loss 1.5s infinite alternate; }

        @keyframes pulse-loss { 0% { box-shadow: 0 0 15px rgba(255, 0, 60, 0.5); } 100% { box-shadow: 0 0 35px rgba(255, 0, 60, 0.9); } }
    </style>
</head>
<body>

    <header>
        <h1>
            <img src="image_4e8ca8.png" class="broadcast-logo" onerror="this.style.display='none'">
            Live <span style="color: var(--neon-cyan);">Leaderboard</span>
        </h1>
        <div class="controls">
            <button class="toggle-btn active" onclick="updateDashboard(1, this)">24 Hours</button>
            <button class="toggle-btn" onclick="updateDashboard(3, this)">3 Days</button>
            <button class="toggle-btn" onclick="updateDashboard(7, this)">7 Days</button>
        </div>
    </header>

    <div id="leaderboard"></div>

    <script>
        let globalDataset = {};
        let sortedDates = [];
        const SIGNIFICANT_GROWTH_THRESHOLD = 5000; 
        let activeDaysBack = 1;

        // Simplified native path resolution for local folders
        function resolveImagePath(imgString) {
            if (!imgString) return 'image_4e8ca8.png';
            if (imgString.startsWith('http')) return imgString;
            
            // Strip leading slashes to safely append to the current GitHub Pages directory
            if (imgString.startsWith('/')) {
                imgString = imgString.substring(1);
            }
            return imgString;
        }

        function formatNumber(num) { return num.toLocaleString('en-US'); }

        async function init() {
            try {
                const response = await fetch('data.json?t=' + Date.now());
                globalDataset = await response.json();
                sortedDates = Object.keys(globalDataset).sort((a, b) => b.localeCompare(a));
                if (sortedDates.length > 0) updateDashboard(activeDaysBack, document.querySelector('.toggle-btn.active'));
            } catch (error) { console.error('Error fetching data:', error); }
        }

        function updateDashboard(daysBack, btnElement) {
            activeDaysBack = daysBack;
            if (btnElement) {
                document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
                btnElement.classList.add('active');
            }

            const latestDate = sortedDates[0];
            const targetIndex = Math.min(daysBack, sortedDates.length - 1);
            const pastDate = sortedDates[targetIndex];
            
            let leaderArray = [];
            for (const [username, currentMetrics] of Object.entries(globalDataset[latestDate])) {
                const currentCount = currentMetrics.count;
                const pastCount = (globalDataset[pastDate] && globalDataset[pastDate][username]) ? globalDataset[pastDate][username].count : currentCount;
                const growth = currentCount - pastCount;
                
                // Calculate percentage
                const pct = pastCount === 0 ? 0 : (growth / pastCount) * 100;

                leaderArray.push({
                    username, currentCount, pastCount, growth, pct, img: resolveImagePath(currentMetrics.img)
                });
            }

            // Sorted strictly by absolute total count descending
            leaderArray.sort((a, b) => b.currentCount - a.currentCount);
            renderCards(leaderArray);
        }

        function renderCards(leaderArray) {
            const board = document.getElementById('leaderboard');
            const cardHeight = 110; 
            const gapX = 30; // 30px gap between columns
            const gapY = 20; // 20px gap between rows

            // Dynamically calculate grid height based on 2 columns
            const rows = Math.ceil(leaderArray.length / 2);
            board.style.height = `${rows * (cardHeight + gapY)}px`;

            leaderArray.forEach((user, index) => {
                let isNewCard = false;
                let card = document.getElementById(`card-${user.username}`);
                
                const isHighGrowth = user.growth >= SIGNIFICANT_GROWTH_THRESHOLD;
                const isLoss = user.growth < 0;
                const pctFormatted = Math.abs(user.pct).toFixed(2) + '%';
                
                if (!card) {
                    isNewCard = true;
                    card = document.createElement('div');
                    card.id = `card-${user.username}`;
                    card.className = 'card';
                    board.appendChild(card);
                }

                // Matrix calculation for 2 columns
                const col = index % 2; 
                const row = Math.floor(index / 2);
                card.style.width = `calc(50% - ${gapX / 2}px)`;
                
                const xOffset = col === 0 ? '0px' : `calc(100% + ${gapX}px)`;
                const yOffset = `${row * (cardHeight + gapY)}px`;
                
                if (isNewCard) {
                    // Start position for load animation (bottom of screen)
                    card.style.transform = `translate(${xOffset}, 150vh)`;
                    card.style.opacity = '0';
                }

                // Force browser reflow to apply initial positions before transitioning
                void card.offsetWidth;

                if (isNewCard) {
                    // Staggered entry from bottom on initial load
                    card.style.transition = `transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) ${index * 0.08}s, opacity 0.8s ease ${index * 0.08}s, box-shadow 0.3s`;
                } else {
                    // Smooth transition for live resorting
                    card.style.transition = `transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s`;
                }

                card.style.opacity = '1';
                card.style.transform = `translate(${xOffset}, ${yOffset})`;
                card.className = `card ${isHighGrowth ? 'high-growth' : ''}`;

                card.innerHTML = `
                    <div class="rank">#${index + 1}</div>
                    <img class="avatar" src="${user.img}" alt="${user.username}" onerror="this.src='image_4e8ca8.png'">
                    <div class="info"><div class="username">@${user.username}</div></div>
                    <div class="metrics">
                        <div class="count">${formatNumber(user.currentCount)}</div>
                        <div class="stats-col">
                            <div class="change-tag ${isLoss ? 'down' : 'up'}">
                                ${isLoss ? '▼' : '▲'} ${formatNumber(Math.abs(user.growth))}
                            </div>
                            <div class="pct-tag">${isLoss ? '-' : '+'}${pctFormatted}</div>
                        </div>
                    </div>
                `;
            });
        }

        window.addEventListener('DOMContentLoaded', init);
        setInterval(init, 60000); 
    </script>
</body>
</html>
