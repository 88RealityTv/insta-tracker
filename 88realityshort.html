<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
<title>StreamStats - Shorts</title>
<style>
  :root {
    --bg: #09090b;
    --card-bg: rgba(18, 18, 26, 0.85);
    --neon-pink: #ff007f;
    --neon-cyan: #00f3ff;
    --neon-red: #ff3333;
    --neon-green: #00ff66;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  
  /* Fix for OBS scrolling: Allow Y-scroll, style webkit scrollbar */
  body { 
    background-color: var(--bg); 
    color: #fff; 
    width: 1080px; 
    min-height: 1920px;
    overflow-x: hidden;
    overflow-y: auto; 
    padding: 60px 40px;
    background: linear-gradient(180deg, #1a1a24 0%, var(--bg) 100%);
  }
  
  ::-webkit-scrollbar { width: 12px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--neon-pink); border-radius: 6px; }

  .header { display: flex; flex-direction: column; align-items: center; gap: 30px; margin-bottom: 50px; }
  .title { font-size: 3.5rem; font-weight: 900; text-transform: uppercase; text-shadow: 0 0 15px var(--neon-cyan); }
  .controls { display: flex; gap: 20px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; }
  .controls button { 
    background: transparent; color: #aaa; border: none; padding: 15px 30px; font-size: 1.8rem; font-weight: bold; 
    border-radius: 12px; cursor: pointer; transition: 0.3s; 
  }
  .controls button.active { background: var(--neon-pink); color: #fff; box-shadow: 0 0 20px var(--neon-pink); }
  
  .leaderboard { display: flex; flex-direction: column; gap: 25px; position: relative; }
  
  .card { 
    background: var(--card-bg); border: 2px solid rgba(255,255,255,0.1); border-radius: 24px; 
    padding: 30px; display: flex; align-items: center; gap: 30px;
    backdrop-filter: blur(15px); transition: transform 0.5s ease, order 0.5s;
  }
  .card.pulse-glow { animation: pulseGain 1.5s infinite alternate; border-color: var(--neon-cyan); }
  .card.loss-glow { border-color: var(--neon-red); background: rgba(255, 51, 51, 0.05); }
  
  @keyframes pulseGain { 0% { box-shadow: 0 0 10px rgba(0, 243, 255, 0.3); } 100% { box-shadow: 0 0 30px rgba(0, 243, 255, 1); } }

  .rank { font-size: 2.5rem; font-weight: 900; color: #555; width: 60px; text-align: center; }
  .avatar { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 3px solid #333; }
  .info { flex-grow: 1; }
  .username { font-size: 2.5rem; font-weight: 800; margin-bottom: 10px; }
  .count { font-size: 3rem; font-weight: 900; }
  .change { font-size: 2rem; font-weight: bold; padding: 10px 20px; border-radius: 12px; }
  .change.up { color: var(--neon-green); background: rgba(0, 255, 102, 0.15); box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.2); }
  .change.down { color: var(--neon-red); background: rgba(255, 51, 51, 0.15); box-shadow: inset 0 0 10px rgba(255, 51, 51, 0.2); }
</style>
</head>
<body>

<div class="header">
  <div class="title">Creator Race</div>
  <div class="controls" id="controls">
    <button class="active" data-range="1">24 Hours</button>
    <button data-range="3">3 Days</button>
    <button data-range="7">7 Days</button>
  </div>
</div>

<div class="leaderboard" id="leaderboard"></div>

<script>
  let rawData = {};
  let currentRange = 1;
  const basePath = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');

  async function init() {
    try {
      const response = await fetch('data.json');
      rawData = await response.json();
      renderStats();
    } catch (e) { console.error("Dataset load failed", e); }
  }

  document.getElementById('controls').addEventListener('click', (e) => {
    if(e.target.tagName === 'BUTTON') {
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentRange = parseInt(e.target.getAttribute('data-range'));
      renderStats();
    }
  });

  function renderStats() {
    const dates = Object.keys(rawData).sort();
    if(dates.length === 0) return;

    const latestDate = dates[dates.length - 1];
    const pastDateIndex = Math.max(0, dates.length - 1 - currentRange);
    const pastDate = dates[pastDateIndex];

    const currentData = rawData[latestDate];
    const pastData = rawData[pastDate];

    let stats = [];
    for (const [user, data] of Object.entries(currentData)) {
      const pastCount = pastData[user] ? pastData[user].count : data.count;
      const growth = data.count - pastCount;
      stats.push({ user, current: data.count, growth, img: data.img });
    }

    stats.sort((a, b) => b.growth - a.growth || b.current - a.current);
    
    const board = document.getElementById('leaderboard');
    board.innerHTML = '';

    stats.forEach((stat, index) => {
      const isUp = stat.growth > 0;
      const isDown = stat.growth < 0;
      const isHighGrowth = stat.growth > 1000; 

      const card = document.createElement('div');
      card.className = `card ${isHighGrowth ? 'pulse-glow' : ''} ${isDown ? 'loss-glow' : ''}`;
      
      const imgSrc = stat.img.startsWith('http') ? stat.img : basePath + stat.img;
      const changeText = isUp ? `+${stat.growth.toLocaleString()}` : isDown ? stat.growth.toLocaleString() : '0';
      const changeClass = isUp ? 'up' : isDown ? 'down' : '';

      card.innerHTML = `
        <div class="rank">#${index + 1}</div>
        <img src="${imgSrc}" class="avatar" alt="${stat.user}">
        <div class="info">
          <div class="username">@${stat.user}</div>
          <div class="count">${stat.current.toLocaleString()}</div>
        </div>
        <div class="change ${changeClass}">${changeText}</div>
      `;
      board.appendChild(card);
    });
  }

  init();
</script>
</body>
</html>
