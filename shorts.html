<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Shorts Tracker</title>
    <style>
        :root {
            --bg-dark: #09090b;
            --card-bg: rgba(18, 18, 26, 0.6);
            --neon-green: #00ff9d;
            --neon-red: #ff003c;
            --neon-cyan: #00f3ff;
            --text-main: #ffffff;
            --text-dim: #a1a1aa;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px; /* Optimal for Shorts 1080x1920 ratio when scaled */
            padding: 30px 20px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-weight: 900;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: var(--neon-cyan);
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        /* Time Range Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 5px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .controls button {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-weight: 800;
            padding: 12px 0;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .controls button.active {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        /* Leaderboard List */
        .leaderboard {
            display: flex;
            flex-direction: column;
            gap: 16px; /* Spacing between rows */
        }

        .card {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 15px 20px;
            backdrop-filter: blur(12px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-sizing: border-box;
            view-transition-name: var(--vt-name);
        }

        /* Position Marker (Top Right) */
        .rank-marker {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 0.85rem;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(0,0,0,0.5);
        }

        .marker-up { color: var(--neon-green); }
        .marker-down { color: var(--neon-red); }
        .marker-none { color: var(--text-dim); }

        /* Animations for Growth/Loss */
        .glow-pulse {
            animation: pulse-green 2s infinite;
        }
        
        .loss-border {
            border-color: rgba(255, 0, 60, 0.5);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.15);
        }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 5px rgba(0,255,157,0.2); border-color: rgba(0,255,157, 0.4); }
            50% { box-shadow: 0 0 20px rgba(0,255,157,0.6); border-color: rgba(0,255,157, 1); }
            100% { box-shadow: 0 0 5px rgba(0,255,157,0.2); border-color: rgba(0,255,157, 0.4); }
        }

        .rank {
            font-size: 1.8rem;
            font-weight: 900;
            color: rgba(255,255,255,0.2);
            margin-right: 15px;
            width: 40px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            margin-right: 15px;
        }

        .info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .username {
            font-size: 1.2rem;
            font-weight: 800;
            margin: 0 0 5px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .stats {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .count {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .change-tag {
            font-size: 0.9rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .change-up {
            background: rgba(0, 255, 157, 0.1);
            color: var(--neon-green);
        }

        .change-down {
            background: rgba(255, 0, 60, 0.1);
            color: var(--neon-red);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LIVE SHORTS TRACKER</h1>
        
        <div class="controls">
            <button class="active" onclick="setTimeRange(1, this)">24H</button>
            <button onclick="setTimeRange(3, this)">3D</button>
            <button onclick="setTimeRange(7, this)">7D</button>
        </div>

        <div class="leaderboard" id="leaderboard"></div>
    </div>

    <script>
        let appData = {};

        async function init() {
            try {
                const response = await fetch('data.json');
                appData = await response.json();
                renderData(1);
            } catch (err) {
                console.error("Failed to load data.json", err);
            }
        }

        function setTimeRange(days, btnElement) {
            document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            // Use View Transitions API for smooth reordering if supported
            if (document.startViewTransition) {
                document.startViewTransition(() => renderData(days));
            } else {
                renderData(days);
            }
        }

        function renderData(daysBack) {
            const dates = Object.keys(appData).sort((a, b) => new Date(b) - new Date(a));
            if (dates.length === 0) return;

            const latestDate = dates[0];
            const pastDate = dates[Math.min(daysBack, dates.length - 1)];

            const latestData = appData[latestDate];
            const pastData = appData[pastDate] || {};

            // Calculate current rankings
            const currentRanks = Object.entries(latestData)
                .sort((a, b) => b[1].count - a[1].count)
                .map((entry, index) => ({ username: entry[0], rank: index + 1, ...entry[1] }));

            // Calculate past rankings
            const pastRanks = Object.entries(pastData)
                .sort((a, b) => b[1].count - a[1].count)
                .map((entry, index) => ({ username: entry[0], rank: index + 1 }));

            const pastRankMap = {};
            pastRanks.forEach(u => pastRankMap[u.username] = u.rank);

            const container = document.getElementById('leaderboard');
            container.innerHTML = '';

            // Safe base URL resolution for GitHub pages
            const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);

            currentRanks.forEach(user => {
                const pastCount = pastData[user.username] ? pastData[user.username].count : user.count;
                const pastRank = pastRankMap[user.username] || user.rank;
                
                const growth = user.count - pastCount;
                const rankDiff = pastRank - user.rank; // Positive means they moved up (e.g., Rank 3 to Rank 1 = +2)

                // Formatting values
                const formattedCount = user.count.toLocaleString();
                const formattedGrowth = Math.abs(growth).toLocaleString();
                
                // Determine styling classes
                let cardClass = 'card';
                let tagClass = 'change-tag';
                let changeIcon = '';
                
                if (growth > 0) {
                    cardClass += ' glow-pulse';
                    tagClass += ' change-up';
                    changeIcon = '▲';
                } else if (growth < 0) {
                    cardClass += ' loss-border';
                    tagClass += ' change-down';
                    changeIcon = '▼';
                }

                // Determine Rank Marker
                let markerClass = 'marker-none';
                let markerText = '-';
                if (rankDiff > 0) {
                    markerClass = 'marker-up';
                    markerText = `▲ ${rankDiff}`;
                } else if (rankDiff < 0) {
                    markerClass = 'marker-down';
                    markerText = `▼ ${Math.abs(rankDiff)}`;
                }

                // Parse image (handles both external links and local relative GH Pages links)
                const imgUrl = user.img.startsWith('http') ? user.img : new URL(user.img, baseUrl).href;

                // Build Element
                const el = document.createElement('div');
                el.className = cardClass;
                el.style.setProperty('--vt-name', `card-${user.username.replace(/[^a-zA-Z0-9]/g, '')}`);
                
                el.innerHTML = `
                    <div class="rank-marker ${markerClass}">${markerText}</div>
                    <div class="rank">#${user.rank}</div>
                    <img src="${imgUrl}" alt="${user.username}" class="avatar">
                    <div class="info">
                        <p class="username">${user.username}</p>
                        <div class="stats">
                            <span class="count">${formattedCount}</span>
                            ${growth !== 0 ? `<span class="${tagClass}">${changeIcon} ${formattedGrowth}</span>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        // Boot
        init();
    </script>
</body>
</html>
