<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS Mobile View - YouTube Shorts</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #09090b; color: #ffffff; font-family: system-ui, sans-serif; 
            padding: 15px; width: 100vw; height: 100vh; overflow-x: hidden;
        }
        h1 { text-align: center; font-size: 22px; margin-bottom: 20px; color: #ff3e3e; text-transform: uppercase; letter-spacing: 2px;}
        .list-container { display: flex; flex-direction: column; gap: 12px; }
        .list-item { 
            background: #12121a; padding: 12px; border-radius: 10px; 
            border: 1px solid #222232; display: flex; align-items: center; justify-content: space-between;
        }
        .left-block { display: flex; align-items: center; gap: 12px; }
        .profile-img { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #e1306c; object-fit: cover; }
        .name { font-size: 15px; font-weight: 700; color: #f3f4f6; text-transform: lowercase; }
        .name::before { content: "@"; color: #e1306c; }
        .count { font-size: 18px; font-weight: 800; color: #ffffff; margin-top: 1px; }
        .right-block { text-align: right; min-width: 90px; }
        .trend-box { font-size: 12px; padding: 2px 0; }
        .trend-lbl { color: #52525b; margin-right: 4px; font-size: 11px; }
        .up { color: #22c55e; font-weight: 700; }
        .down { color: #ef4444; font-weight: 700; }
        .neutral { color: #71717a; }
    </style>
</head>
<body>
    <h1>🔥 TOP TRACKER</h1>
    <div class="list-container" id="shorts-dashboard">Loading mobile data...</div>

    <script>
        function formatNum(n) { return n ? n.toLocaleString() : 'N/A'; }
        function getTrendHTML(today, past) {
            if (!today || !past) return `<span class="neutral">--</span>`;
            const diff = today - past;
            if (diff > 0) return `<span class="up">+${formatNum(diff)}</span>`;
            if (diff < 0) return `<span class="down">${formatNum(diff)}</span>`;
            return `<span class="neutral">0</span>`;
        }

        async function init() {
            try {
                const res = await fetch('data.json');
                const data = await res.json();
                const dates = Object.keys(data).sort();
                
                const today = dates[dates.length - 1];
                const yesterday = dates[dates.length - 2] || null;
                const weekAgo = dates[Math.max(0, dates.length - 7)] !== today ? dates[Math.max(0, dates.length - 7)] : null;

                const tData = data[today], yData = yesterday ? data[yesterday] : {}, wData = weekAgo ? data[weekAgo] : {};
                const container = document.getElementById('shorts-dashboard');
                container.innerHTML = '';

                for (const user in tData) {
                    const cur = tData[user].count;
                    const imgUrl = tData[user].img || 'https://placeholder.com';
                    const yVal = yData[user] ? yData[user].count : null;
                    const wVal = wData[user] ? wData[user].count : null;

                    const row = document.createElement('div');
                    row.className = 'list-item';
                    row.innerHTML = `
                        <div class="left-block">
                            <img class="profile-img" src="${imgUrl}" alt="${user}">
                            <div>
                                <div class="name">${user}</div>
                                <div class="count">${formatNum(cur)}</div>
                            </div>
                        </div>
                        <div class="right-block">
                            <div class="trend-box"><span class="trend-lbl">24h:</span>${getTrendHTML(cur, yVal)}</div>
                            <div class="trend-box"><span class="trend-lbl">7d:</span>${getTrendHTML(cur, wVal)}</div>
                        </div>
                    `;
                    container.appendChild(row);
                }
            } catch (e) { container.innerText = "Error parsing json."; }
        }
        init();
    </script>
</body>
</html>
