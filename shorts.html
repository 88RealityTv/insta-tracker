<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OBS Mobile View - YouTube Shorts</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: #09090b; 
            color: #ffffff; 
            font-family: system-ui, sans-serif; 
            padding: 15px; 
            width: 100vw; 
            height: 100vh; 
            overflow-x: hidden;
        }
        
        /* Mobile Switch Controls */
        .controls-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            margin-top: 5px;
        }
        .toggle-wrapper {
            background: #12121a;
            padding: 4px;
            border-radius: 30px;
            display: inline-flex;
            border: 1px solid #222232;
        }
        .toggle-btn {
            background: transparent;
            border: none;
            color: #71717a;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.2s ease;
        }
        .toggle-btn.active {
            color: #ffffff;
            background: #ff3e3e; 
            box-shadow: 0 2px 8px rgba(255, 62, 62, 0.4);
        }

        .list-container { display: flex; flex-direction: column; gap: 10px; }
        .list-item { 
            background: #12121a; padding: 12px; border-radius: 10px; 
            border: 1px solid #222232; display: flex; align-items: center; justify-content: space-between;
        }
        .left-block { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .profile-img { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #ff3e3e; object-fit: cover; flex-shrink: 0; }
        .name { font-size: 15px; font-weight: 700; color: #f3f4f6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .count { font-size: 18px; font-weight: 800; color: #ffffff; margin-top: 1px; }
        .right-block { text-align: right; min-width: 100px; flex-shrink: 0; }
        .trend-box { font-size: 13px; font-weight: 700; }
        .trend-lbl { color: #52525b; font-weight: 500; font-size: 11px; display: block; margin-bottom: 2px; }
        .up { color: #22c55e; }
        .down { color: #ef4444; }
        .neutral { color: #71717a; }
    </style>
</head>
<body>

    <div class="controls-container">
        <div class="toggle-wrapper">
            <button class="toggle-btn active" onclick="changeRange(1, this)">24H</button>
            <button class="toggle-btn" onclick="changeRange(3, this)">3 Days</button>
            <button class="toggle-btn" onclick="changeRange(7, this)">7 Days</button>
        </div>
    </div>

    <div class="list-container" id="shorts-dashboard">Loading mobile data...</div>

    <script>
        let globalData = {};
        let currentDaysOffset = 1;

        // Base URL logic to correctly map relative image directories on YouTube Shorts view
        const currentPath = window.location.pathname;
        const directoryPath = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
        const baseUrl = window.location.origin + directoryPath;

        function formatNum(n) { return n ? n.toLocaleString() : '0'; }
        
        function getTrendHTML(today, past) {
            if (today === undefined || past === undefined) return `<span class="neutral">--</span>`;
            const diff = today - past;
            if (diff > 0) return `<span class="up">+${formatNum(diff)}</span>`;
            if (diff < 0) return `<span class="down">${formatNum(diff)}</span>`;
            return `<span class="neutral">0</span>`;
        }

        function changeRange(days, element) {
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            currentDaysOffset = days;
            renderDashboard();
        }

        function renderDashboard() {
            const dates = Object.keys(globalData).sort();
            if (dates.length === 0) return;

            const todayIndex = dates.length - 1;
            const pastIndex = Math.max(0, todayIndex - currentDaysOffset);

            const todayDate = dates[todayIndex];
            const pastDate = dates[pastIndex];

            const tData = globalData[todayDate];
            const pData = (pastIndex !== todayIndex) ? globalData[pastDate] : {};
            
            const container = document.getElementById('shorts-dashboard');
            container.innerHTML = '';

            const rangeLabels = { 1: "24H Change", 3: "3D Change", 7: "7D Change" };

            for (const user in tData) {
                const cur = tData[user].count;
                let imgUrl = tData[user].img || '';
                const pastVal = pData[user] ? pData[user].count : undefined;

                // Format file links to use absolute project directories
                if (imgUrl && !imgUrl.startsWith('http') && !imgUrl.startsWith('data:')) {
                    if (imgUrl.startsWith('./')) {
                        imgUrl = imgUrl.substring(2);
                    }
                    imgUrl = baseUrl + imgUrl;
                } else if (!imgUrl) {
                    imgUrl = 'https://placeholder.com';
                }

                const row = document.createElement('div');
                row.className = 'list-item';
                row.innerHTML = `
                    <div class="left-block">
                        <img class="profile-img" src="${imgUrl}" alt="${user}" onerror="this.src='https://placeholder.com'">
                        <div>
                            <div class="name">${user}</div>
                            <div class="count">${formatNum(cur)}</div>
                        </div>
                    </div>
                    <div class="right-block">
                        <span class="trend-lbl">${rangeLabels[currentDaysOffset]}</span>
                        <div class="trend-box">${getTrendHTML(cur, pastVal)}</div>
                    </div>
                `;
                container.appendChild(row);
            }
        }

        async function init() {
            try {
                const res = await fetch('data.json');
                globalData = await res.json();
                renderDashboard();
            } catch (e) { 
                document.getElementById('shorts-dashboard').innerText = "Error loading data."; 
            }
        }
        init();
    </script>
</body>
</html>
