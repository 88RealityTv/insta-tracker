<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
    <title>StreamStats - Vertical</title>
    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: rgba(18, 18, 26, 0.75);
            --pink-grad: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --text-main: #ffffff;
            --text-muted: #8892b0;
            --card-h: 160px;
            --card-gap: 25px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #2a1b38 0%, transparent 60%);
            color: var(--text-main);
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 80px 50px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
            z-index: 10;
        }

        .title-box h1 {
            font-size: 4.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: var(--pink-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        .controls {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            padding: 15px;
            gap: 15px;
        }

        .controls button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 2rem;
            font-weight: 800;
            padding: 15px 40px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .controls button.active {
            background: var(--text-main);
            color: var(--bg-color);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }

        .leaderboard {
            position: relative;
            flex: 1;
            width: 100%;
        }

        .card {
            position: absolute;
            left: 0;
            right: 0;
            height: var(--card-h);
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 0 40px;
            transition: top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: visible;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px var(--glow-color), inset 0 0 10px var(--glow-color); }
            50% { box-shadow: 0 0 40px var(--glow-color), inset 0 0 20px var(--glow-color); }
            100% { box-shadow: 0 0 10px var(--glow-color), inset 0 0 10px var(--glow-color); }
        }

        .card.active-glow {
            border-color: var(--glow-color);
            animation: pulseGlow 2s infinite ease-in-out;
        }

        .marker {
            position: absolute;
            top: -25px;
            right: 40px;
            background: var(--bg-color);
            border: 3px solid var(--glow-color);
            color: var(--text-main);
            font-size: 1.5rem;
            font-weight: 900;
            padding: 8px 25px;
            border-radius: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            z-index: 5;
            letter-spacing: 1px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid var(--text-muted);
            object-fit: cover;
            margin-right: 40px;
        }

        .info {
            flex: 1;
        }

        .username {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .count {
            font-size: 2rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .change-tag {
            font-size: 3rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

    </style>
</head>
<body>
    <div class="header">
        <div class="title-box">
            <h1>Follower Tracker</h1>
        </div>
        <div class="controls">
            <button onclick="updateData(1)" id="btn-1">24H</button>
            <button onclick="updateData(3)" id="btn-3" class="active">3D</button>
            <button onclick="updateData(7)" id="btn-7">7D</button>
        </div>
    </div>
    <div class="leaderboard" id="leaderboard"></div>

    <script>
        let rawData = null;
        let dates = [];
        const cardHeight = 160;
        const cardGap = 25;

        async function init() {
            try {
                const res = await fetch('data.json');
                rawData = await res.json();
                dates = Object.keys(rawData).sort();
                updateData(3);
            } catch (err) {
                console.error("Error loading data.json", err);
            }
        }

        function getAbsolutePath(path) {
            if(path.startsWith('http')) return path;
            const baseUrl = window.location.origin + window.location.pathname;
            return new URL(path, baseUrl).href;
        }

        function updateData(daysAgo) {
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${daysAgo}`).classList.add('active');

            if (!dates.length) return;
            const latestDate = dates[dates.length - 1];
            const pastIndex = Math.max(0, dates.length - 1 - daysAgo);
            const pastDate = dates[pastIndex];

            const currentStats = rawData[latestDate];
            const pastStats = rawData[pastDate];

            let players = [];
            let posPercents = [];
            let negPercents = [];

            for (const [user, data] of Object.entries(currentStats)) {
                const currentCount = data.count;
                const pastCount = pastStats[user] ? pastStats[user].count : currentCount;
                const growth = currentCount - pastCount;
                const percent = pastCount > 0 ? (growth / pastCount) * 100 : 0;

                if(percent > 0) posPercents.push(percent);
                if(percent < 0) negPercents.push(Math.abs(percent));

                players.push({ user, currentCount, growth, percent, img: data.img });
            }

            players.sort((a, b) => b.growth - a.growth);

            const maxPos = Math.max(...posPercents, 0.01);
            const minPos = Math.min(...posPercents, 0);
            const maxNeg = Math.max(...negPercents, 0.01);
            const minNeg = Math.min(...negPercents, 0);

            const board = document.getElementById('leaderboard');
            
            players.forEach((p, index) => {
                let card = document.getElementById(`card-${p.user}`);
                if (!card) {
                    card = document.createElement('div');
                    card.id = `card-${p.user}`;
                    card.className = 'card active-glow';
                    card.innerHTML = `
                        <div class="marker" id="marker-${p.user}"></div>
                        <img class="avatar" id="img-${p.user}" src="" alt="">
                        <div class="info">
                            <div class="username">${p.user}</div>
                            <div class="count" id="count-${p.user}"></div>
                        </div>
                        <div class="change-tag" id="change-${p.user}"></div>
                    `;
                    board.appendChild(card);
                }

                card.style.top = `${index * (cardHeight + cardGap)}px`;
                document.getElementById(`img-${p.user}`).src = getAbsolutePath(p.img);
                document.getElementById(`count-${p.user}`).innerText = p.currentCount.toLocaleString();

                const changeEl = document.getElementById(`change-${p.user}`);
                const markerEl = document.getElementById(`marker-${p.user}`);
                
                let glowColor, intensity;
                if (p.growth > 0) {
                    changeEl.innerText = `▲ +${p.growth.toLocaleString()}`;
                    changeEl.style.color = '#00ff88';
                    let ratio = posPercents.length > 1 ? (p.percent - minPos) / (maxPos - minPos) : 1;
                    intensity = 0.3 + (0.7 * ratio);
                    glowColor = `rgba(0, 255, 136, ${intensity})`;
                    markerEl.innerText = index === 0 ? "🏆 TOP GAINER" : "📈 UP";
                } else if (p.growth < 0) {
                    changeEl.innerText = `▼ ${p.growth.toLocaleString()}`;
                    changeEl.style.color = '#ff3366';
                    let absP = Math.abs(p.percent);
                    let ratio = negPercents.length > 1 ? (absP - minNeg) / (maxNeg - minNeg) : 1;
                    intensity = 0.3 + (0.7 * ratio);
                    glowColor = `rgba(255, 51, 102, ${intensity})`;
                    markerEl.innerText = index === players.length - 1 ? "🔻 BIG DROP" : "⚠️ LOSS";
                } else {
                    changeEl.innerText = `- 0`;
                    changeEl.style.color = 'var(--text-muted)';
                    glowColor = 'rgba(255,255,255,0.1)';
                    card.classList.remove('active-glow');
                    markerEl.innerText = "FLAT";
                }

                if(p.growth !== 0) card.classList.add('active-glow');
                card.style.setProperty('--glow-color', glowColor);
                markerEl.style.color = p.growth > 0 ? '#00ff88' : (p.growth < 0 ? '#ff3366' : 'var(--text-muted)');
            });
        }

        init();
    </script>
</body>
</html>
